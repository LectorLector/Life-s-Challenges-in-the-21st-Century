<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>二十一世紀線</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="末班車上的六個人生難題，終點揭曉你是八種夜行者中的哪一種">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Noto+Sans+TC:wght@500;900&family=Noto+Serif+TC:wght@400;600&display=swap">
<style>
/* 版面概念：一條斜向的構成主義地鐵線。每一站＝左側色塊構圖（直書站名）＋右側逐步展開的旅程手札。 */
:root{
  --paper:#E2E0D8; --paper-2:#D5D2C8; --paper-3:#C9C5BA;
  --ink:#2E2D2A; --ink-soft:#5B5852; --line:rgba(46,45,42,.18);
  --clay:#A8655A;   /* 莫蘭迪化的構成主義紅 */
  --ochre:#C3A36A; --sage:#94A08B; --slate:#7A8B99; --rose:#C6A49E; --plum:#8B7983; --fog:#B7B1A6;
  --on-accent:#F3F0E9;
  --f-display:"Big Shoulders Display","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-head:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --step--1:clamp(.82rem,.78rem + .2vw,.9rem);
  --step-0:clamp(1rem,.96rem + .2vw,1.08rem);
  --step-1:clamp(1.2rem,1.1rem + .5vw,1.45rem);
  --step-2:clamp(1.55rem,1.3rem + 1.2vw,2.2rem);
  --step-3:clamp(2.2rem,1.6rem + 3vw,4rem);
  --step-4:clamp(3rem,2rem + 6vw,7.5rem);
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#1F1E1C; --paper-2:#2A2926; --paper-3:#35332F;
  --ink:#E7E2D7; --ink-soft:#ABA59A; --line:rgba(231,226,215,.16);
  --clay:#BF7B6F; --ochre:#CDB078; --sage:#A1AC97; --slate:#8E9EAC; --rose:#C9A8A2; --plum:#A28F99; --fog:#77716A;
  --on-accent:#1F1E1C; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#1F1E1C; --paper-2:#2A2926; --paper-3:#35332F;
  --ink:#E7E2D7; --ink-soft:#ABA59A; --line:rgba(231,226,215,.16);
  --clay:#BF7B6F; --ochre:#CDB078; --sage:#A1AC97; --slate:#8E9EAC; --rose:#C9A8A2; --plum:#A28F99; --fog:#77716A;
  --on-accent:#1F1E1C; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:var(--step-0);line-height:1.85;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--clay);outline-offset:3px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}

/* ---------- 頂欄 ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;gap:14px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--paper);border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--f-head);font-weight:900;letter-spacing:.06em;white-space:nowrap;background:none;border:0;padding:0;cursor:pointer}
.brand b{font-family:var(--f-display);font-weight:900;font-size:1.35rem;background:var(--clay);color:var(--on-accent);padding:0 .35em;letter-spacing:.02em}
.brand span{font-size:.95rem}
.minimap{flex:1;display:flex;align-items:center;gap:0;min-width:0;max-width:340px;margin-left:auto}
.minimap i{flex:1;height:3px;background:var(--line);position:relative}
.minimap i::after{content:"";position:absolute;right:-5px;top:-4px;width:11px;height:11px;border-radius:50%;background:var(--paper);border:2px solid var(--ink-soft)}
.minimap i.done{background:var(--ink)}
.minimap i.done::after{background:var(--ink);border-color:var(--ink)}
.minimap i.now::after{background:var(--clay);border-color:var(--clay);box-shadow:0 0 0 4px color-mix(in srgb,var(--clay) 25%,transparent)}
.sound{display:flex;align-items:center;gap:8px;margin-left:10px;border:2px solid var(--ink);background:var(--paper);padding:4px 10px 4px 6px;cursor:pointer;font-family:var(--f-head);font-size:.82rem;font-weight:500;max-width:46vw}
.sound .eq{display:flex;align-items:flex-end;gap:2px;height:16px;width:18px;flex:none}
.sound .eq span{width:4px;background:var(--clay);height:4px;transition:height .2s}
.sound.on .eq span{animation:eq 1.1s infinite var(--ease)}
.sound.on .eq span:nth-child(2){animation-delay:-.4s}.sound.on .eq span:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{height:4px}50%{height:15px}}
.sound .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){.minimap{display:none}.brand span{display:none}.sound{margin-left:auto}}

/* ---------- 場景 ---------- */
.scene{display:none}
.scene.active{display:block;animation:sceneIn .7s var(--ease)}
@keyframes sceneIn{from{opacity:.0;transform:translateY(14px)}to{opacity:1;transform:none}}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto}

/* ---------- 封面 ---------- */
.cover{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);padding-block:clamp(24px,5vw,64px);align-items:center}
.cover-art{position:relative;aspect-ratio:4/5;max-width:100%;background:var(--paper-2);overflow:hidden}
.cover-art svg{position:absolute;inset:0;width:100%;height:100%}
.eyebrow{font-family:var(--f-display);font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-size:.9rem;color:var(--clay)}
.cover h1{font-family:var(--f-head);font-weight:900;font-size:var(--step-4);line-height:.95;letter-spacing:-.01em;margin-top:.15em}
.cover h1 em{font-style:normal;display:block;font-family:var(--f-display);font-weight:900;font-size:.62em;letter-spacing:.04em;color:var(--ink-soft)}
.cover .lede{font-size:var(--step-1);line-height:1.7;margin-top:1rem;max-width:30em}
.manifest{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;margin-top:1.5rem;background:var(--ink);border:2px solid var(--ink)}
.manifest div{background:var(--paper);padding:.6rem .7rem;font-family:var(--f-head);font-size:.85rem;line-height:1.4}
.manifest b{display:block;font-family:var(--f-display);font-size:1.6rem;font-weight:900;line-height:1}
.ticket-form{margin-top:1.6rem;display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.ticket-form label{flex-basis:100%;font-family:var(--f-head);font-size:.85rem;color:var(--ink-soft)}
.ticket-form input{flex:1 1 180px;min-width:0;font:inherit;font-family:var(--f-head);padding:.7rem .9rem;border:2px solid var(--ink);background:var(--paper);color:var(--ink)}
.note{font-family:var(--f-head);font-size:var(--step--1);color:var(--ink-soft);margin-top:.8rem;line-height:1.6}

/* ---------- 按鈕 ---------- */
.btn{display:inline-flex;align-items:center;gap:.6em;font-family:var(--f-head);font-weight:900;letter-spacing:.06em;
  padding:.75rem 1.2rem;border:2px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;
  transition:transform .2s var(--ease),box-shadow .2s var(--ease);box-shadow:4px 4px 0 var(--clay)}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--clay)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--clay)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none}
.btn.ghost:hover{background:var(--paper-2)}
.btn .arr{font-family:var(--f-display);font-size:1.2em;line-height:1}

/* ---------- 路線圖 ---------- */
.map{padding-block:clamp(28px,5vw,64px)}
.map-head{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between}
.map-head h2{font-family:var(--f-head);font-weight:900;font-size:var(--step-3);line-height:1}
.ticket{display:grid;grid-template-columns:auto auto;gap:2px 14px;border:2px dashed var(--ink-soft);padding:.6rem .9rem;font-family:var(--f-head);font-size:.82rem;line-height:1.5;background:var(--paper-2)}
.ticket dt{color:var(--ink-soft)} .ticket dd{margin:0;font-weight:900}
.route{list-style:none;margin:clamp(28px,5vw,56px) 0 0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));position:relative}
.route::before{content:"";position:absolute;left:calc(100%/14);right:calc(100%/14);top:34px;height:6px;background:var(--ink)}
.stop{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:0 4px}
.node{position:relative;z-index:1;width:74px;height:74px;display:grid;place-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:50%;cursor:default}
.node svg{width:52px;height:52px}
.stop.next .node{border-color:var(--clay);box-shadow:0 0 0 6px color-mix(in srgb,var(--clay) 22%,transparent);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--clay) 8%,transparent)}}
.stop .num{font-family:var(--f-display);font-weight:900;font-size:1rem;letter-spacing:.1em;color:var(--ink-soft)}
.stop .nm{font-family:var(--f-head);font-weight:900;font-size:1.05rem;line-height:1.2}
.stop .bk{font-family:var(--f-head);font-size:.78rem;color:var(--ink-soft);line-height:1.35}
.stop.done .nm{color:var(--ink)}
.stop.todo{opacity:.6}
.train{position:absolute;top:18px;z-index:2;width:46px;height:38px;transition:left 1.4s var(--ease);pointer-events:none}
.map-cta{margin-top:clamp(28px,5vw,48px);display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.map-cta .hint{font-family:var(--f-head);font-size:.9rem;color:var(--ink-soft);flex-basis:100%}
@media (max-width:760px){
  .route{grid-template-columns:1fr;gap:18px}
  .route::before{left:35px;right:auto;top:20px;bottom:20px;width:6px;height:auto}
  .stop{flex-direction:row;text-align:left;align-items:center;gap:14px}
  .stop .txt{display:flex;flex-direction:column}
  .train{display:none}
}

/* ---------- 站點 ---------- */
.station{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(20px,4vw,56px);padding-block:clamp(20px,4vw,48px)}
.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);align-self:start;aspect-ratio:4/5;max-width:100%;background:var(--paper-2);overflow:hidden}
.panel svg.art{position:absolute;inset:0;width:100%;height:100%}
.panel .vname i{font-style:normal;display:block;line-height:1.08}
.panel .vname{position:absolute;right:5%;top:5%;display:flex;flex-direction:column;align-items:center;background:var(--paper);padding:.18em .14em;border:2px solid var(--ink);font-family:var(--f-head);font-weight:900;font-size:clamp(2.2rem,1.4rem + 3vw,4.4rem);line-height:1;letter-spacing:.08em;color:var(--ink);text-shadow:0 0 0 transparent}
.panel .vnum{position:absolute;left:5%;bottom:3%;font-family:var(--f-display);font-weight:900;font-size:clamp(4rem,3rem + 6vw,9rem);line-height:.8;color:var(--ink);letter-spacing:-.02em}
.panel .vtag{position:absolute;left:5%;top:5%;font-family:var(--f-display);font-weight:800;letter-spacing:.2em;font-size:.85rem;background:var(--ink);color:var(--paper);padding:.15em .6em}
@media (max-width:860px){
  .station{grid-template-columns:1fr}
  .panel{position:relative;top:0;aspect-ratio:16/10}
  .panel .vname{font-size:clamp(1.8rem,7vw,3rem)}
  .panel .vnum{font-size:clamp(3.4rem,14vw,6rem)}
}
.log{display:flex;flex-direction:column;gap:clamp(22px,3vw,34px);min-width:0;padding-bottom:30vh}
.block{border-top:2px solid var(--ink);padding-top:1rem;animation:blockIn .8s var(--ease) both}
@keyframes blockIn{from{opacity:.2;transform:translateY(18px)}to{opacity:1;transform:none}}
.block .tag{display:inline-block;font-family:var(--f-display);font-weight:800;letter-spacing:.18em;font-size:.82rem;text-transform:uppercase;color:var(--clay);margin-bottom:.4rem}
.block h2{font-family:var(--f-head);font-weight:900;font-size:var(--step-3);line-height:1.08}
.block h3{font-family:var(--f-head);font-weight:900;font-size:var(--step-1);line-height:1.35;margin-bottom:.4rem}
.question{font-family:var(--f-head);font-weight:500;font-size:var(--step-2);line-height:1.4;margin-top:.6rem;max-width:22em}
.prose{max-width:38em}
.prose p+p{margin-top:.8em}
.plate{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0;margin-top:1.2rem;border:2px solid var(--ink);max-width:38em}
.plate .spine{width:54px;background:var(--clay);position:relative}
.plate .spine span{position:absolute;inset:10px 0;writing-mode:vertical-rl;margin:auto;font-family:var(--f-display);font-weight:900;letter-spacing:.2em;color:var(--on-accent);font-size:.8rem;text-align:center}
.plate .meta{padding:.8rem 1rem;font-family:var(--f-head);line-height:1.5;min-width:0}
.plate .en{font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:.02em;line-height:1.15}
.plate .zh{font-weight:900;font-size:1rem;margin-top:.2rem}
.plate .by{font-size:.85rem;color:var(--ink-soft)}
.plate .thesis{margin-top:.5rem;font-family:var(--f-body);font-size:.95rem}
.chip{display:inline-flex;align-items:center;gap:.5em;margin-top:1rem;font-family:var(--f-head);font-size:.82rem;line-height:1.5;color:var(--ink-soft);border-left:4px solid var(--ochre);padding:.2rem .7rem;max-width:38em}
.vignette{font-size:var(--step-1);line-height:1.8;max-width:30em;padding-left:1rem;border-left:6px solid var(--slate)}
.choices{display:grid;gap:10px;margin-top:1.2rem;max-width:38em}
.choice{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:stretch;text-align:left;border:2px solid var(--ink);background:var(--paper);cursor:pointer;padding:0;transition:background .2s,transform .2s var(--ease)}
.choice .k{display:grid;place-items:center;background:var(--ink);color:var(--paper);font-family:var(--f-display);font-weight:900;font-size:1.3rem}
.choice .t{padding:.7rem .9rem;font-family:var(--f-head);font-weight:500;line-height:1.5}
.choice:hover:not([disabled]){transform:translateX(4px);background:var(--paper-2)}
.choice[disabled]{cursor:default;opacity:.42}
.choice.picked{opacity:1;background:var(--paper-2)}
.choice.picked .k{background:var(--clay);color:var(--on-accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:1rem}
.card{display:block;width:100%;perspective:1400px;border:0;padding:0;background:none;text-align:left;cursor:pointer;font:inherit}
.card .in{display:grid;width:100%;min-height:13rem;transition:transform .8s var(--ease);transform-style:preserve-3d}
.card.flipped .in{transform:rotateY(180deg)}
.card .face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--ink);padding:.9rem 1rem;display:flex;flex-direction:column}
.card .front{background:var(--c,var(--slate));color:var(--on-accent);justify-content:space-between;gap:1rem}
.card .front .n{font-family:var(--f-display);font-weight:900;font-size:3.2rem;line-height:.9}
.card .front .kw{font-family:var(--f-head);font-weight:900;font-size:1.25rem;line-height:1.3}
.card .front .tap{font-family:var(--f-head);font-size:.75rem;letter-spacing:.1em;opacity:.85}
.card .back{background:var(--paper);transform:rotateY(180deg);font-size:.93rem;line-height:1.75}
.card .back b{font-family:var(--f-head);font-weight:900;display:block;margin-bottom:.3rem;font-size:1rem;line-height:1.4}
.card.lab .front{background:var(--ink);color:var(--paper)}
.card.lab .front .n{font-size:1.1rem;letter-spacing:.2em;color:var(--ochre)}
.counter{font-family:var(--f-head);font-size:.85rem;color:var(--ink-soft);margin-top:.6rem}
.quote{font-family:var(--f-head);font-weight:900;font-size:var(--step-2);line-height:1.45;max-width:20em;position:relative;padding-left:1.2em}
.quote::before{content:"";position:absolute;left:0;top:.25em;bottom:.25em;width:.42em;background:var(--clay)}
.earn{display:flex;align-items:center;gap:16px;margin-top:1.4rem;font-family:var(--f-head);font-size:.95rem}
.earn svg{width:72px;height:72px;flex:none;animation:earn 1.2s var(--ease) both}
@keyframes earn{from{transform:scale(.2) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}
.transfer{margin-top:1.4rem;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;background:var(--paper-2);padding:.9rem 1rem;max-width:38em;font-family:var(--f-head);font-size:.9rem;line-height:1.65}
.transfer .sign{font-family:var(--f-display);font-weight:900;background:var(--ochre);color:var(--ink);padding:.1em .5em;letter-spacing:.12em;font-size:.8rem;white-space:nowrap}
.actions{margin-top:1.3rem;display:flex;flex-wrap:wrap;gap:12px}
.care{border:2px solid var(--slate);background:var(--paper-2);padding:1rem 1.1rem;max-width:38em;font-family:var(--f-head);font-size:.93rem;line-height:1.7}
.care h3{font-size:1.05rem}
.lines{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:.6rem}
.lines div{background:var(--paper);border:1px solid var(--line);padding:.45rem .6rem;line-height:1.35}
.lines b{font-family:var(--f-display);font-size:1.5rem;font-weight:900;display:block;user-select:all}
.disclaimer{font-family:var(--f-head);font-size:.8rem;color:var(--ink-soft);margin-top:.8rem;max-width:38em}

/* ---------- 終點 ---------- */
.finale{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(20px,4vw,56px);padding-block:clamp(24px,5vw,56px);align-items:start}
.poster{aspect-ratio:4/5;max-width:100%;background:var(--paper-2);position:relative;overflow:hidden}
.poster svg{position:absolute;inset:0;width:100%;height:100%}
.journey{list-style:none;padding:0;margin:1rem 0 0;display:grid;gap:0;border-top:2px solid var(--ink)}
.journey li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;padding:.65rem 0;border-bottom:1px solid var(--line);font-family:var(--f-head);font-size:.93rem;line-height:1.5}
.journey svg{width:44px;height:44px}
.journey b{font-weight:900}
.shelf{width:100%;border-collapse:collapse;font-family:var(--f-head);font-size:.88rem;line-height:1.5;margin-top:.8rem}
.shelf th,.shelf td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}
.shelf th{font-weight:900;border-bottom:2px solid var(--ink)}
.shelf td:first-child{font-family:var(--f-display);font-weight:900;font-size:1.05rem;color:var(--clay)}
.tablebox{overflow-x:auto;max-width:100%}
@media (max-width:860px){.cover,.finale{grid-template-columns:1fr}.cover-art{aspect-ratio:5/4}}

/* ---------- 動態 ---------- */
.spin{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite}
.spin-r{transform-box:fill-box;transform-origin:center;animation:spin 90s linear infinite reverse}
.drift{animation:drift 9s ease-in-out infinite alternate}
.drift2{animation:drift 12s ease-in-out infinite alternate-reverse}
.breathe{transform-box:fill-box;transform-origin:center;animation:breathe 5s ease-in-out infinite}
.blink{animation:blink 3.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(10px,-8px)}}
@keyframes breathe{50%{transform:scale(1.06)}}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){

    {q:()=> '幸運物真的有用嗎？',

  quiz:{q:'研究者念出發音相同的英文字，請人寫下來，例如 die／dye（死亡／染色）、pain／pane（疼痛／窗格）。越焦慮的人會怎麼寫？',

    on = v; if (!ctx) return;
    master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(v ? .8 : 0, ctx.currentTime + .6);
    if (v && ctx.state==='suspended') ctx.resume();
  }
  document.addEventListener('visibilitychange', ()=>{ if(!ctx) return; if(document.hidden) ctx.suspend(); else if(on) ctx.resume(); });
  async function offline(id, secs){
    const saved={ctx,bus,master,waves,cur}; const def=T[id];
    ctx = new OfflineAudioContext(2, Math.floor(44100*secs), 44100); waves={};
    const keep=ctx; const AC=window.AudioContext; window.AudioContext=function(){return keep}; const ok=(()=>{ const c=ctx; ctx=null; window.AudioContext=function(){return c}; return init(); })(); window.AudioContext=AC;
    master.gain.value=.8; const g=ctx.createGain(); g.gain.value=def.gain||1; g.connect(bus);

    for (let loop=0; ; loop++){ let any=false; for (const e of def.ev){ const t=(loop*def.len+e[0])*cur.spb+.05; if (t<secs-.5){ voice(g,t,e); any=true; } } if(!any) break; }
    const buf = await ctx.startRendering(); let pk=0, ss=0, n=0;
    for (let c=0;c<2;c++){ const d=buf.getChannelData(c); for (let i=0;i<d.length;i++){ const v=Math.abs(d[i]); if(v>pk) pk=v; ss+=d[i]*d[i]; n++; if(isNaN(d[i])) return {nan:true}; } }
    ({ctx,bus,master,waves,cur}=saved);
    return {peak:+pk.toFixed(3), rms:+Math.sqrt(ss/n).toFixed(4)};
  }
  return { play, unlock, setOn, _offline:offline, get on(){return on}, get unlocked(){return unlocked}, get current(){return cur && cur.id}, _T:T, _m:m };
})();

/* ---------- 幾何元件渲染（SVG / Canvas 共用） ---------- */
const LIGHT = {'--paper':'#E2E0D8','--paper-2':'#D5D2C8','--paper-3':'#C9C5BA','--ink':'#2E2D2A','--ink-soft':'#5B5852','--clay':'#A8655A','--ochre':'#C3A36A','--sage':'#94A08B','--slate':'#7A8B99','--rose':'#C6A49E','--plum':'#8B7983','--fog':'#B7B1A6'};
const cv = c => `var(${c})`;
function primSVG(p){
  const [t,...a] = p;
  if (t==='circle') return `<circle cx="${a[0]}" cy="${a[1]}" r="${a[2]}" fill="${cv(a[3])}"/>`;
  if (t==='ring') return `<circle cx="${a[0]}" cy="${a[1]}" r="${a[2]}" fill="none" stroke="${cv(a[3])}" stroke-width="${a[4]}"/>`;
  if (t==='poly') return `<polygon points="${a[0]}" fill="${cv(a[1])}"/>`;
  if (t==='rect') return `<rect x="${a[0]}" y="${a[1]}" width="${a[2]}" height="${a[3]}" fill="${cv(a[4])}"${a[5]?` transform="rotate(${a[5]} ${a[0]+a[2]/2} ${a[1]+a[3]/2})"`:''}/>`;
  if (t==='rrect') return `<rect x="${a[0]}" y="${a[1]}" width="${a[2]}" height="${a[3]}" rx="${a[4]}" fill="${cv(a[5])}" stroke="${cv(a[6])}" stroke-width="${a[7]}"/>`;
  if (t==='path') return `<path d="${a[0]}" fill="${cv(a[1])}"/>`;
  if (t==='line') return `<path d="${a[0]}" fill="none" stroke="${cv(a[1])}" stroke-width="${a[2]}" stroke-linejoin="miter"/>`;
  if (t==='rot') return `<g transform="rotate(${a[0]} 50 50)">${a[1].map(primSVG).join('')}</g>`;
  if (t==='g') return `<g transform="${a[0]}">${a[1].map(primSVG).join('')}</g>`;
  return '';
}
function primCanvas(ctx, p){
  const [t,...a] = p, col = c => LIGHT[c] || c;
  ctx.save();
  if (t==='circle'){ ctx.fillStyle=col(a[3]); ctx.beginPath(); ctx.arc(a[0],a[1],a[2],0,Math.PI*2); ctx.fill(); }
  else if (t==='ring'){ ctx.strokeStyle=col(a[3]); ctx.lineWidth=a[4]; ctx.beginPath(); ctx.arc(a[0],a[1],a[2],0,Math.PI*2); ctx.stroke(); }
  else if (t==='poly'){ const pts=a[0].split(' ').map(s=>s.split(',').map(Number)); ctx.fillStyle=col(a[1]); ctx.beginPath(); pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.closePath(); ctx.fill(); }
  else if (t==='rect'){ ctx.fillStyle=col(a[4]); if(a[5]){ ctx.translate(a[0]+a[2]/2,a[1]+a[3]/2); ctx.rotate(a[5]*Math.PI/180); ctx.fillRect(-a[2]/2,-a[3]/2,a[2],a[3]); } else ctx.fillRect(a[0],a[1],a[2],a[3]); }
  else if (t==='rrect'){ const [x,y,w,h,r]=a; ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); ctx.fillStyle=col(a[5]); ctx.fill(); ctx.strokeStyle=col(a[6]); ctx.lineWidth=a[7]; ctx.stroke(); }
  else if (t==='path'){ ctx.fillStyle=col(a[1]); ctx.fill(new Path2D(a[0])); }
  else if (t==='line'){ ctx.strokeStyle=col(a[1]); ctx.lineWidth=a[2]; ctx.lineJoin='miter'; ctx.stroke(new Path2D(a[0])); }
  else if (t==='rot'){ ctx.translate(50,50); ctx.rotate(a[0]*Math.PI/180); ctx.translate(-50,-50); a[1].forEach(q=>primCanvas(ctx,q)); }
  else if (t==='g'){ const m=/translate\(([-\d.]+) ([-\d.]+)\)(?: rotate\(([-\d.]+) ([-\d.]+) ([-\d.]+)\))? scale\(([-\d.]+)\)/.exec(a[0]);
    ctx.translate(+m[1],+m[2]); if(m[3]){ ctx.translate(+m[4],+m[5]); ctx.rotate(+m[3]*Math.PI/180); ctx.translate(-m[4],-m[5]); } ctx.scale(+m[6],+m[6]); a[1].forEach(q=>primCanvas(ctx,q)); }
  ctx.restore();
}
const tokenPrims = (id, k) => { const t = TOKENS[id]; return t.p(t.c['ABC'.indexOf(k)] || t.c[0]); };
const tokenSVG = (id, k, cls='') => k ? `<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true">${tokenPrims(id,k).map(primSVG).join('')}</svg>`
  : `<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="30" fill="none" stroke="var(--ink-soft)" stroke-width="5" stroke-dasharray="7 7"/></svg>`;

function posterPrims(type, ch){
  const T = TYPES[type], [c0,c1] = T.c, P = [];
  P.push(['rect',0,0,400,500,'--paper-2']);
  if (T.G) P.push(['rect',40,46,236,236,c0,-6]); else P.push(['circle',176,176,134,c0]);
  if (T.O) P.push(['poly','-20,320 420,190 420,236',c1]); else { P.push(['ring',306,318,64,c1,14]); P.push(['ring',306,318,30,c1,10]); }
  if (T.F) P.push(['path','M150 500 a110 110 0 0 1 220 0z','--rose']); else { [0,1,2].forEach(i=>P.push(['rect',230,404+i*22,150,8,'--ink'])); }
  P.push(['rect',-60,270,540,20,'--ink',-16]);
  STATIONS.forEach((st,i)=>{ if(!ch[st.id]) return; const s=.62, x=26+i*60, y=392-i*20; P.push(['g',`translate(${x} ${y}) scale(${s})`, tokenPrims(st.id, ch[st.id])]); });
  return P;
}
const posterSVG = (type, ch) => `<svg viewBox="0 0 400 500" aria-hidden="true">${posterPrims(type,ch).map(primSVG).join('')}</svg>`;

/* ---------- 計分 ---------- */
function score(g0){
  let g=0,o=0,f=0;
  STATIONS.forEach(st=>{ const c = st.choices.find(x=>x.k===g0.ch[st.id]); if(c){ g+=c.s[0]; o+=c.s[1]; f+=c.s[2]; } });
  const range = g0.pain.length ? Math.max(...g0.pain)-Math.min(...g0.pain) : 2;
  if (g0.draws >= 3) g++;
  if (g0.pops >= 8) g++; else if (g0.pops === 0) g--;
  if (range >= 4) f++; else if (range === 0) f--;
  const Gx = g>=2 || (g===1 && g0.ch.anxiety==='A');
  const Ox = o>=2 || (o===1 && g0.ch.depression==='A');
  const Fx = f>=1 || (f===0 && g0.ch.love==='B');
  const type = Object.keys(TYPES).find(k=>TYPES[k].G===+Gx && TYPES[k].O===+Ox && TYPES[k].F===+Fx);
  let ep;
  if (range>=5) ep = `痛感從 ${Math.min(...g0.pain)} 跳到 ${Math.max(...g0.pain)} 分的`;
  else if (g0.pops>=10) ep = `戳破 ${g0.pops} 個萬一的`;
  else if (g0.pops===0) ep = '一個萬一都沒戳的';
  else if (g0.draws>=3) ep = `連抽 ${g0.draws} 支籤的`;
  else if (g0.dose>=90) ep = `把劑量轉到 ${g0.dose} 的`;
  else if (g0.dose<=3) ep = '把劑量歸零的';
  else if (g0.flips===3) ep = '偷看完所有祕密的';
  else if (g0.flips===0) ep = '一張都沒偷看的';
  else ep = `帶著${g0.fortune ? g0.fortune.n : '一支籤'}的`;
  return {type, ep};
}

    mg.innerHTML = `<div class="vend"><div class="caps"><span style="--c:var(--sage)">睡得著</span><span style="--c:var(--slate)">不緊張</span><span style="--c:var(--ochre)">忘記今天</span></div>
      <svg class="dose" viewBox="0 0 320 170" aria-hidden="true"><line x1="20" y1="140" x2="310" y2="140" stroke="var(--ink)" stroke-width="2"/><line x1="20" y1="10" x2="20" y2="140" stroke="var(--ink)" stroke-width="2"/>
        <path id="ce" fill="none" stroke="var(--sage)" stroke-width="4"/><path id="cs" fill="none" stroke="var(--clay)" stroke-width="4" stroke-dasharray="7 5"/>
        <line id="mk" y1="10" y2="140" stroke="var(--ink)" stroke-width="2"/><text x="300" y="160" text-anchor="end" font-size="11" fill="var(--ink-soft)" font-family="sans-serif">劑量 →</text></svg>
      <label class="dial" for="dose">劑量 <b id="dv">20</b></label><input type="range" id="dose" min="0" max="100" value="20">
      <div class="readout"><span><i style="background:var(--sage)"></i>效果 <b id="re">0%</b></span><span><i style="background:var(--clay)"></i>副作用 <b id="rs">0%</b></span></div></div>`;
    const E = d => 1/(1+Math.exp(-(d-42)/8)), Sd = d => 1/(1+Math.exp(-(d-74)/7));
    const X = d => 20 + d*2.9, Y = v => 140 - v*124;
    const curve = fn => Array.from({length:101},(_,d)=>`${d?'L':'M'}${X(d).toFixed(1)} ${Y(fn(d)).toFixed(1)}`).join(' ');
    $('#ce').setAttribute('d', curve(E)); $('#cs').setAttribute('d', curve(Sd));
    const upd = () => { const d = +$('#dose').value; G.dose = d; $('#dv').textContent = d; $('#mk').setAttribute('x1', X(d)); $('#mk').setAttribute('x2', X(d));
      $('#re').textContent = Math.round(E(d)*100)+'%'; $('#rs').textContent = Math.round(Sd(d)*100)+'%'; };
    $('#dose').addEventListener('input', upd); upd();
    setTimeout(()=>showChoices(st), reduced?0:900);
  },
  pain(st){
    const mg = $('#mg'); const labels = ['月台','終點線','深夜'];
    const step = k => {
      mg.innerHTML = `<div class="painq"><p class="pq">${PAIN_Q[k]}</p><div class="pnum" id="pn">5</div>
        <input type="range" id="pr" min="0" max="10" value="5" aria-label="痛的分數"><div class="pscale"><span>0 不痛</span><span>10 最痛</span></div>
        <div class="actions"><button class="btn" id="pok"><span>就這個分數</span><span class="arr">→</span></button></div></div>`;
      $('#pr').addEventListener('input', e=>$('#pn').textContent = e.target.value);
      $('#pok').addEventListener('click', ()=>{ G.pain[k] = +$('#pr').value; if (k<2) step(k+1); else done(); });
      into(mg);
    };
    const done = () => {
      mg.innerHTML = `<div class="painsum">${G.pain.map((v,k)=>`<div><span>${labels[k]}</span><b>${v}</b></div>`).join('')}</div>
        <p class="ln">同一根腳趾，三個分數。</p>`;
      showChoices(st);
    };
    step(0);
  },
  depression(st){
    const mg = $('#mg');
    mg.innerHTML = `<div class="phone"><div class="ph-top"><span class="av">遠</span><b>阿遠</b></div><div class="ph-body" id="pb">
      <p class="day">8 月 14 日</p><p class="msg them">最近有點累，下次再約</p><p class="msg me">好啊，保重！</p>
      <p class="day">兩個月後・03:00</p></div></div>`;
    const pb = $('#pb');
    const typing = async ms => { const t = document.createElement('p'); t.className = 'msg them typing'; t.innerHTML = '<i></i><i></i><i></i>'; pb.appendChild(t); await wait(reduced?100:ms); t.remove(); };
    (async()=>{ await wait(600); await typing(2600); const s = document.createElement('p'); s.className='sys'; s.textContent='（阿遠停止輸入）'; pb.appendChild(s);
      await wait(500);
      showChoices(st, async c=>{ const me = document.createElement('p'); me.className='msg me'; me.textContent = c.t.replace(/^「|」$/g,'');
        if (c.k==='B'){ me.className='sys'; me.textContent='你對阿遠的照片按了愛心。'; }
        pb.appendChild(me); into(mg); await wait(900);
        if (c.reply && c.reply.length){ await typing(1600); for (const r of c.reply){ const p=document.createElement('p'); p.className='msg them'; p.textContent=r; pb.appendChild(p); await wait(reduced?50:900); } }
        if (c.sys){ await wait(1200); const p=document.createElement('p'); p.className='sys heart'; p.textContent=c.sys; pb.appendChild(p); }
        await wait(500); });
    })();
  },
  love(st){
    const mg = $('#mg');
    mg.innerHTML = `<div class="profile"><div class="pf-top"><span class="av big">澄</span><div><b>阿澄</b><span>契合度 <em>94%</em></span></div></div>
      <div class="traits">${TRAITS.map((t,k)=>`<button class="trait" data-k="${k}"><span class="q">？</span><span class="a"><b>${t.h}</b>${t.t}</span></button>`).join('')}</div>
      <p class="pf-tip">點一下，偷看對方的小祕密。</p></div>
      <div class="actions"><button class="btn ghost" id="pfdone"><span>把手機收起來</span><span class="arr">→</span></button></div>`;
    $$('.trait', mg).forEach(t=>t.addEventListener('click', ()=>{ if (!t.classList.contains('open')){ t.classList.add('open'); G.flips++; } }));
    $('#pfdone').addEventListener('click', async e=>{ e.currentTarget.parentElement.remove(); $$('.trait', mg).forEach(t=>t.disabled=true);
      const q = document.createElement('div'); q.className = 'narr'; mg.appendChild(q);
      await say(q, ['列車晃了一下。對方忽然轉頭看著你——']);
      const big = document.createElement('p'); big.className = 'bigq'; big.textContent = '「你為什麼喜歡我？」'; mg.appendChild(big);
      await wait(reduced?0:700); showChoices(st); });
  }
};

/* ---------- 終點：讀票 ---------- */
async function reveal(){
  const r = score(G); G.result = r;
  store.set({...store.get(), last:r.type});
  const ov = document.createElement('div'); ov.className = 'ride read';
  ov.innerHTML = `<div class="ride-in"><div class="rtime">05:52</div><div class="rnext">列車長正在讀你的車票</div>
    <div class="rtokens">${STATIONS.map((st,k)=>`<span style="animation-delay:${k*.18}s">${tokenSVG(st.id, G.ch[st.id])}</span>`).join('')}</div></div>`;
  document.body.appendChild(ov);
  Music.play(TYPES[r.type].track);
  await wait(reduced ? 300 : 2600);
  ov.classList.add('out'); setTimeout(()=>ov.remove(), 450);
  result(r.type, r.ep);
}

/* ---------- 結果 ---------- */
function kTitle(n){ return n>=6?'全對。你可以去當這班車的列車長了。':n>=4?'直覺很準，科學也站在你這邊。':n>=2?'有些研究結果跟你想的不一樣，這正是它們有趣的地方。':'大部分都猜錯了？很正常，這些研究之所以有名，就是因為結果出人意料。'; }
function shareText(T, ep){ return `我在《二十一世紀線》末班車上，是「${ep}${T.name}」。\n「${T.essence}」\n你會是哪一種夜行者？ #二十一世紀線`; }
function result(type, ep){
  const T = TYPES[type], M = TYPES[T.match], bk = BOOKS[T.book], name = G.name || '無名乘客';
  try{ history.replaceState(null, '', '#r-' + type); }catch(e){}
  const url = ARTIFACT_URL + '#r-' + type, txt = shareText(T, ep);
  const enc = encodeURIComponent;
  show(`<section class="wrap result">
    <div class="r-art"><div class="poster">${posterSVG(type, G.ch)}<span class="p-name">${esc(name)}</span><span class="p-en">${T.en}</span></div></div>
    <div class="r-copy">
      <div class="eyebrow">終點站・黎明 05:52 ・ ${esc(name)} 的車票判讀</div>
      <p class="r-ep">${esc(ep)}</p>
      <h1 class="r-name">${T.name}</h1>
      <p class="r-quote">「${T.essence}」</p>
      <p class="r-desc">${T.desc}</p>
      <dl class="r-traits"><div><dt>你的光</dt><dd>${T.plus}</dd></div><div><dt>你的影子</dt><dd>${T.minus}</dd></div><div><dt>列車長留言</dt><dd>${T.line}</dd></div></dl>
      <div class="share">
        <p class="sh-h">把車票分享出去</p>
        <div class="sh-row">
          <button class="sh ig" id="ig"><span>IG 限動圖</span></button>
          <a class="sh" target="_blank" rel="noopener" href="https://www.threads.com/intent/post?text=${enc(txt)}&url=${enc(url)}">Threads</a>
          <a class="sh" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${enc(url)}">Facebook</a>
          <a class="sh" target="_blank" rel="noopener" href="https://social-plugins.line.me/lineit/share?url=${enc(url)}&text=${enc(txt)}">LINE</a>
          <button class="sh" id="copy">複製連結</button>
        </div>
        <p class="sh-msg" id="shmsg" aria-live="polite"></p>
      </div>
    </div></section>
    <section class="wrap r-more">
      <div class="card-row">
        <div class="mini-card"><span class="mc-tag">你的主題曲・正在播放</span><b>${TRACKS_INFO[T.track].t}</b><span>${TRACKS_INFO[T.track].d}</span></div>
        <div class="mini-card"><span class="mc-tag">列車長推薦你讀</span><b>${bk.z} ${bk.t}</b><span>${bk.a}・${bk.y}</span><p>${T.why}</p></div>
        <div class="mini-card"><span class="mc-tag">最合拍的同行者</span><b>${M.name}</b><span>「${M.essence}」</span><p>你們朝同一個方向看，只是握方向盤的方式不同。</p></div>
      </div>
      <div class="kpass"><div><span>知識乘車證</span><b>${Object.values(G.quiz).filter(Boolean).length}<small>/6</small></b><em>猜對的研究</em></div><div><b>${G.clues}<small>/18</small></b><em>解開的「為什麼」</em></div><p>${kTitle(Object.values(G.quiz).filter(Boolean).length)}</p></div>
      <h3 class="sec-h">你的六張車票</h3>
      <ol class="tickets">${STATIONS.map(st=>{ const c = st.choices.find(x=>x.k===G.ch[st.id]); return `<li>${tokenSVG(st.id, G.ch[st.id])}<span class="tn">${st.no} ${st.name}</span><b>${c?c.tag:'—'}</b></li>`; }).join('')}</ol>
      <details class="back"><summary>翻到車票背面：六本書與全部 24 則研究</summary>
        <ul>${STATIONS.map(st=>{ const b = BOOKS[st.id], D = DEBRIEF[st.id]; return `<li><b>${st.name}・${b.z}</b><span>${b.t}｜${b.a}｜${b.y}</span><p>${st.stub.t}</p><details class="more"><summary>這一站的研究（${D.clues.length+1} 則）</summary><p><b>${D.quiz.q}</b> ${D.quiz.ex}</p>${D.clues.map(c=>`<p><b>${c.q(G)}</b> ${c.a}</p>`).join('')}</details></li>`; }).join('')}</ul>
        <p class="note">六本書都是牛津大學出版社「A Very Short Introduction」系列。車上的音樂是公有領域樂曲，由網頁即時合成的改編片段。</p>
      </details>
      <h3 class="sec-h">八種夜行者</h3>
      <div class="types">${Object.entries(TYPES).map(([k,t])=>`<div class="type ${k===type?'me':''} ${k===T.match?'mate':''}"><div class="ty-art">${posterSVG(k,{})}</div><b>${t.name}</b><span>${t.essence}</span>${k===type?'<em>你</em>':k===T.match?'<em>同行者</em>':''}</div>`).join('')}</div>
      <p class="note care-foot">如果這趟夜車讓你想起某些難受的事：安心專線 1925（24 小時）・生命線 1995・張老師 1980。</p>
      <div class="actions"><button class="btn" id="again"><span>再搭一次</span><span class="arr">↺</span></button></div>
    </section>`);
  $('#again').addEventListener('click', ()=>{ try{ history.replaceState(null,'',location.pathname + location.search); }catch(e){} G = null; cover(); });
  $('#copy').addEventListener('click', async ()=>{ const m = $('#shmsg');
    try{ await navigator.clipboard.writeText(txt + '\n' + url); m.textContent = '已複製連結和結果文字。'; }
    catch(e){ m.innerHTML = `複製失敗，請手動選取：<input class="copybox" readonly value="${esc(url)}">`; $('.copybox').select(); } });
  $('#ig').addEventListener('click', ()=> storyImage(type, ep, name));
}

/* ---------- IG 限動圖（1080×1920） ---------- */
async function storyImage(type, ep, name){
  const T = TYPES[type], msg = $('#shmsg'); msg.textContent = '正在印製你的車票圖……';
  const W = 1080, H = 1920, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  const fam = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif', disp = '"Big Shoulders Display",sans-serif';
  try{ await Promise.all([document.fonts.load(`900 120px ${fam}`, T.name+ep+name+'二十一世紀線你會是哪一種夜行者'), document.fonts.load(`500 40px ${fam}`, T.essence+T.line), document.fonts.load(`900 60px ${disp}`, 'LINE 21'+T.en)]); }catch(e){}
  x.fillStyle = LIGHT['--paper']; x.fillRect(0,0,W,H);
  x.save(); x.beginPath(); x.rect(108,170,864,1080); x.clip(); x.translate(108,170); x.scale(864/400, 864/400); posterPrims(type, G.ch).forEach(p=>primCanvas(x,p)); x.restore();
  x.fillStyle = LIGHT['--ink']; x.fillRect(0,0,W,120);
  x.fillStyle = LIGHT['--paper']; x.font = `900 52px ${disp}`; x.textBaseline = 'middle'; x.fillText('LINE 21', 64, 62);
  x.font = `900 40px ${fam}`; x.textAlign = 'right'; x.fillText('二十一世紀線・末班車', W-64, 62); x.textAlign = 'left';
  x.fillStyle = LIGHT['--clay']; x.fillRect(108,1080+170-14,864,14);
  x.fillStyle = LIGHT['--ink-soft']; x.font = `500 40px ${fam}`; x.textBaseline = 'alphabetic';
  x.fillText(`${name} 的車票判讀`, 108, 1340);
  x.fillStyle = LIGHT['--clay']; x.font = `900 46px ${fam}`; wrap(x, ep, 108, 1410, 864, 56);
  x.fillStyle = LIGHT['--ink']; x.font = `900 ${T.name.length>4?128:150}px ${fam}`; x.fillText(T.name, 100, 1590);
  x.fillStyle = LIGHT['--ink-soft']; x.font = `900 44px ${disp}`; x.fillText(T.en, 108, 1662);
  x.fillStyle = LIGHT['--ink']; x.font = `500 44px ${fam}`; wrap(x, `「${T.essence}」`, 108, 1752, 864, 60);
  x.fillStyle = LIGHT['--ochre']; x.fillRect(0, H-110, W, 110);
  x.fillStyle = LIGHT['--ink']; x.font = `900 40px ${fam}`; x.textBaseline='middle'; x.fillText('你會是哪一種夜行者？', 64, H-55);
  x.font = `900 40px ${disp}`; x.textAlign='right'; x.fillText('#二十一世紀線', W-64, H-55);
  const blob = await new Promise(r=>c.toBlob(r,'image/png'));
  const dl = await (window.claude?.use ? window.claude.use('downloads').catch(()=>null) : null);
  if (dl){
    try{ await dl.save({filename:`line21-${type}.png`, data:blob}); msg.textContent = '已存好。打開 IG 限時動態，從相簿選這張圖，再貼上連結貼紙。'; return; }
    catch(e){ if (e && e.code==='declined'){ msg.textContent = '已取消儲存。'; return; } }
  }
  const url = URL.createObjectURL(blob);
  const md = document.createElement('div'); md.className = 'modal';
  md.innerHTML = `<div class="modal-in"><img src="${url}" alt="${esc(T.name)} 結果圖"><p>長按（手機）或右鍵（電腦）圖片即可儲存，再到 IG 限時動態上傳。</p><button class="btn" id="mclose"><span>好</span></button></div>`;
  document.body.appendChild(md); $('#mclose').addEventListener('click', ()=>md.remove()); msg.textContent = '';
}
function wrap(x, text, X, Y, maxW, lh){ let line = '', y = Y; for (const ch of text){ if (x.measureText(line+ch).width > maxW && line){ x.fillText(line, X, y); line = ch; y += lh; } else line += ch; } x.fillText(line, X, y); }

/* ---------- 聲音 ---------- */
const sb = $('#sound');
function syncSound(){ sb.classList.toggle('on', Music.on && Music.unlocked); sb.setAttribute('aria-pressed', String(Music.on && Music.unlocked)); }
document.addEventListener('track', e=>{ const info = TRACKS_INFO[e.detail]; $('#slbl').textContent = info ? info.t : ''; });
sb.addEventListener('click', ()=>{ if (!Music.unlocked){ Music.unlock(); Music.setOn(true); } else Music.setOn(!Music.on); syncSound(); });
$('#home').addEventListener('click', ()=>{ G = null; cover(); });
window.__line21 = { score, TYPES };
cover(); syncSound();
})();
</script>
